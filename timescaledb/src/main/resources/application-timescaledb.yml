events:
  export:
    timescaledb:
      enabled: false
      min-level: INFO
      host: localhost
      port: 5432
      database: qalipsis
      schema: events
      linger-period: 10s
      batch-size: 20000
      publishers: 1
      username: qalipsis_user
      password: qalipsis-pwd

meters:
  export:
    timescaledb:
      enabled: false
      host: localhost
      port: 5432
      database: qalipsis
      schema: meters
      username: qalipsis_user
      password: qalipsis-pwd
  provider:
    timescaledb:
      metadata:
        refresh-delay: PT5M
        initial-delay: PT1M
        min-age: PT5M
        chunk-size: 50