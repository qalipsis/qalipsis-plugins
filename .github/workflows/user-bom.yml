name: User BOM Platform

on:
  push:
    branches: [ 'main' ]
    paths: ['user-bom/**', 'buildSrc/**', 'build.gradle.kts', 'settings.gradle.kts', 'gradle.properties', 'gradle/**']
  workflow_dispatch:

jobs:
  publish:
    # The platform is only published from main, including when the workflow is started manually on another branch.
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_publish-only.yml
    with:
      module: qalipsis-platform
    secrets: inherit
