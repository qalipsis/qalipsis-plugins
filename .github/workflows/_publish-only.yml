name: Publish Only

on:
  workflow_call:
    inputs:
      module:
        description: 'Gradle module name (e.g., qalipsis-platform)'
        required: true
        type: string

env:
  GITHUB_ACTIONS: true

jobs:
  publish:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Prepare publishing configuration
        env:
          JRELEASER_CONFIGURATION: ${{ secrets.JRELEASER_CONFIGURATION }}
        run: |
          mkdir -p $HOME/.jreleaser
          echo "$JRELEASER_CONFIGURATION" > $HOME/.jreleaser/config.yml ;

      - name: Publish artifacts
        run: ./gradlew :${{ inputs.module }}:publish :${{ inputs.module }}:jreleaserFullRelease
